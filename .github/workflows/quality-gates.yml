name: quality-gates

on:
  pull_request:
  push:
    branches: [main, 'feat/**']

jobs:
  python-arbitrage:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: python_worker
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install --upgrade pip
      - run: pip install -r requirements.txt pytest
      - run: pytest -q

  frontend-quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 'latest'
      - run: bun install --frozen-lockfile
      # Existing UI code is not uniformly Prettier-formatted. Keep ESLint
      # focused on correctness rules while formatting is migrated separately.
      - run: bunx eslint . --rule 'prettier/prettier: off'
