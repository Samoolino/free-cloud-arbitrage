version: 1
# Catalog of requested Hummingbot-compatible venues/routes.
# Enable only after adapter-specific auth, market-data and execution tests pass.
venues:
  - backpack
  - binance
  - bitget
  - derive
  - gate_io
  - hyperliquid
  - kucoin
  - okx
  - aevo
  - architect
  - bingx
  - bitrue
  - bitstamp
  - btc_markets
  - bybit
  - coinbase
  - decibel
  - dexalot
  - dydx
  - evedex
  - foxbit
  - gemini
  - grvt
  - htx
  - injective
  - kraken
  - lambdaplex
  - lighter
  - mexc
  - ndax
  - pacifica
routers:
  - meteora
  - orca
  - jupiter
  - pancakeswap
  - raydium
  - uniswap
  - xrpl

integration_contract:
  market_data:
    - order_book
    - trades
    - ticker
    - executable_vwap
  execution:
    - order_submission
    - cancel
    - fill_tracking
    - reconciliation
  risk:
    - fees
    - slippage
    - gas
    - quote_age
    - liquidity
    - venue_health
    - balance
  secrets:
    cex: "API credentials via runtime secret manager; trading-only permissions preferred"
    dex: "RPC + signer reference; raw private keys prohibited in application config"

activation:
  default: disabled
  required_checks:
    - authentication
    - market_data
    - symbol_mapping
    - precision_limits
    - balance
    - dry_run
    - execution_canary
    - reconciliation
    - emergency_disarm
