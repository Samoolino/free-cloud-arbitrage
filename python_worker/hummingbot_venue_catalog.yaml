version: 2
# Expanded Hummingbot-compatible discovery catalog.
# Enable each connector only after adapter-specific auth, market-data,
# execution, balance and reconciliation tests pass.
venues:
  - backpack
  - binance
  - bitget
  - derive
  - gate_io
  - hyperliquid
  - kucoin
  - okx
  - aevo
  - architect
  - bingx
  - bitrue
  - bitstamp
  - btc_markets
  - bybit
  - coinbase
  - decibel
  - dexalot
  - dydx
  - evedex
  - foxbit
  - gemini
  - grvt
  - htx
  - injective
  - kraken
  - lambdaplex
  - lighter
  - mexc
  - ndax
  - pacifica
routers:
  - meteora
  - orca
  - jupiter
  - pancakeswap
  - raydium
  - uniswap
  - xrpl

integration_contract:
  market_data:
    - order_book
    - trades
    - ticker
    - executable_vwap
  execution:
    - order_submission
    - cancel
    - fill_tracking
    - reconciliation
  risk:
    - fees
    - slippage
    - gas
    - quote_age
    - liquidity
    - venue_health
    - balance
  secrets:
    cex: "API credentials via runtime secret manager; trading-only permissions preferred"
    dex: "RPC + signer reference; raw private keys prohibited in application config"

opportunity_matrix:
  enabled_pairs:
    - CEX_CEX
    - DEX_DEX
    - CEX_DEX
  notifications: true
  executable_assertion_requires:
    - fresh_quotes
    - executable_depth
    - known_fees
    - gas_cost
    - slippage_budget
    - sufficient_inventory
    - positive_net_profit
    - capital_gate
    - venue_health

activation:
  default: disabled
  required_checks:
    - authentication
    - market_data
    - symbol_mapping
    - precision_limits
    - balance
    - dry_run
    - execution_canary
    - reconciliation
    - emergency_disarm
